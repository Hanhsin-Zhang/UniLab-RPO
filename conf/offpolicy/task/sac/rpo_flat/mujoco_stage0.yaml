# @package _global_

training:
  task_name: RPOFlat
  sim_backend: mujoco
  logger: tensorboard
  no_play: false
  play_env_num: 16
  play_steps: 400

algo:
  seed: 42
  num_envs: 4096
  max_iterations: 8000
  save_interval: 500
  learning_starts: 10
  updates_per_step: 8
  gamma: 0.98
  tau: 0.0625
  actor_lr: 2.0e-4
  critic_lr: 2.0e-4
  actor_hidden_dim: 256
  critic_hidden_dim: 512
  num_atoms: 101
  obs_normalization: false
  use_symmetry: false
  algo_params:
    alpha_lr: 3.0e-4
    alpha_init: 0.002
    target_entropy_ratio: 0.0
    max_grad_norm: 0.0

reward:
  scales:
    track_lin_vel_xy_exp: 3.0
    track_ang_vel_z_exp: 1.5
    alive: 10.0
    lin_vel_z_l2: -0.05
    ang_vel_xy_l2: -0.02
    flat_orientation_l2: -0.25
    action_rate_l2: -0.005
    action_smoothness_l2: -0.002
    joint_torques_l2: 0.0
    joint_vel_l2: -5.0e-5
    dof_acc_l2: 0.0
    energy: 0.0
    undesired_contacts: 0.0
    dof_pos_limits: 0.0
    feet_air_time: 0.2
    feet_contact_without_cmd: 0.0
    feet_height: 0.5
    feet_orientation_l2: -0.1
    feet_distance: 0.1
    knee_distance: 0.1
    stand_still: 0.0
    upward: 2.0
    joint_deviation_hip: -0.01
    joint_deviation_legs: -0.005
    joint_deviation_torso: -0.05
    joint_deviation_arms: -0.01
  tracking_sigma: 0.2
  min_base_height: 0.22
  max_tilt_deg: 70.0
  undesired_contact_threshold: 1.0
  feet_air_time_threshold: 0.4
  feet_air_time_command_threshold: 0.01
  feet_height_threshold: 0.02
  feet_height_command_threshold: 0.01
  feet_height_probe_reduction: min
  feet_distance_min: 0.16
  feet_distance_max: 0.50
  knee_distance_min: 0.18
  knee_distance_max: 0.35
  stand_still_command_threshold: 0.01
  stand_still_body_vel_threshold: 0.5
  stand_still_pos_weight: 1.0
  stand_still_vel_weight: 0.04

env:
  sim_dt: 0.0025
  ctrl_dt: 0.02
  # SAC stage0: disable standing-command mixture to avoid learning a trivial
  # "hold default pose then fall" solution.
  rel_standing_envs: 0.0
  command_resample_interval: 10.0
  # 网络结构改动待测
  actor_obs_history_length: 1
  critic_obs_history_length: 1
  control_config:
    action_scale: 0.25
  noise_config:
    level: 0.0
    scale_joint_angle: 0.0
    scale_joint_vel: 0.0
    scale_gyro: 0.0
    scale_gravity: 0.0
    scale_linvel: 0.0
  domain_rand:
    randomize_base_mass: false
    randomize_body_mass: false
    random_com: false
    randomize_ground_friction: false
    randomize_dof_armature: false
    randomize_kp: false
    randomize_kd: false
    push_robots: false
    randomize_reset_joint_qpos: true
    reset_joint_qpos_range: [-0.1, 0.1]
    randomize_reset_base_qvel: true
    reset_base_qvel_range:
      - [-0.5, -0.5, -0.2, -0.52, -0.52, -0.78]
      - [0.5, 0.5, 0.2, 0.52, 0.52, 0.78]
